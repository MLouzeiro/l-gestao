services:
  db:
    image: postgres:17-alpine
    container_name: estoque-postgres
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
